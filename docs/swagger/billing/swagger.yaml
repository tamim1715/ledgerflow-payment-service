definitions:
  billing.BillItem:
    properties:
      amount:
        type: number
      bill_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      quantity:
        type: integer
      unit_price:
        type: number
    type: object
  billing.BillListResponse:
    properties:
      bills:
        items:
          $ref: '#/definitions/billing.BillResponse'
        type: array
      limit:
        example: 10
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 1
        type: integer
    type: object
  billing.BillPaymentDetailResponse:
    properties:
      bill_number:
        example: INV-2026-0001
        type: string
      created_at:
        example: "2026-08-07T15:00:00Z"
        type: string
      currency:
        example: USD
        type: string
      customer_id:
        example: cust_987654
        type: string
      discount:
        example: 10
        type: number
      due_date:
        example: "2026-12-31T23:59:59Z"
        type: string
      id:
        example: bill_123abc456def
        type: string
      issue_date:
        example: "2026-08-07T15:00:00Z"
        type: string
      items:
        items:
          $ref: '#/definitions/billing.BillItem'
        type: array
      metadata:
        type: object
      notes:
        example: Monthly enterprise subscription invoice
        type: string
      paid_amount:
        example: 305
        type: number
      payments:
        items:
          $ref: '#/definitions/payment.PaymentResponse'
        type: array
      status:
        allOf:
        - $ref: '#/definitions/billing.BillStatus'
        example: DRAFT
      subtotal:
        example: 300
        type: number
      tax:
        example: 15
        type: number
      total_amount:
        example: 305
        type: number
      updated_at:
        example: "2026-08-07T15:00:00Z"
        type: string
    type: object
  billing.BillResponse:
    properties:
      bill_number:
        example: INV-2026-0001
        type: string
      created_at:
        example: "2026-08-07T15:00:00Z"
        type: string
      currency:
        example: USD
        type: string
      customer_id:
        example: cust_987654
        type: string
      discount:
        example: 10
        type: number
      due_date:
        example: "2026-12-31T23:59:59Z"
        type: string
      id:
        example: bill_123abc456def
        type: string
      issue_date:
        example: "2026-08-07T15:00:00Z"
        type: string
      items:
        items:
          $ref: '#/definitions/billing.BillItem'
        type: array
      metadata:
        type: object
      notes:
        example: Monthly enterprise subscription invoice
        type: string
      paid_amount:
        example: 305
        type: number
      status:
        allOf:
        - $ref: '#/definitions/billing.BillStatus'
        example: DRAFT
      subtotal:
        example: 300
        type: number
      tax:
        example: 15
        type: number
      total_amount:
        example: 305
        type: number
      updated_at:
        example: "2026-08-07T15:00:00Z"
        type: string
    type: object
  billing.BillStatus:
    enum:
    - DRAFT
    - PENDING
    - PARTIALLY_PAID
    - PAID
    - OVERDUE
    - CANCELLED
    type: string
    x-enum-varnames:
    - BillStatusDraft
    - BillStatusPending
    - BillStatusPartiallyPaid
    - BillStatusPaid
    - BillStatusOverdue
    - BillStatusCancelled
  billing.CreateBillItemRequest:
    properties:
      description:
        example: Cloud Hosting & Infrastructure
        type: string
      quantity:
        example: 2
        type: integer
      unit_price:
        example: 150
        minimum: 0
        type: number
    required:
    - description
    - quantity
    - unit_price
    type: object
  billing.CreateBillRequest:
    properties:
      currency:
        example: USD
        type: string
      customer_id:
        example: cust_987654
        type: string
      discount:
        example: 10
        minimum: 0
        type: number
      due_date:
        example: "2026-12-31T23:59:59Z"
        type: string
      items:
        items:
          $ref: '#/definitions/billing.CreateBillItemRequest'
        type: array
      metadata:
        type: object
      notes:
        example: Monthly enterprise subscription invoice
        type: string
      tax:
        example: 15
        minimum: 0
        type: number
    required:
    - currency
    - customer_id
    - due_date
    - items
    type: object
  billing.PayBillRequest:
    properties:
      amount:
        example: 150
        type: number
      description:
        example: Payment for Invoice INV-2026-0001
        type: string
      idempotency_key:
        example: ik_pay_bill_123
        type: string
      metadata:
        type: object
      provider:
        allOf:
        - $ref: '#/definitions/payment.PaymentProvider'
        example: STRIPE
    required:
    - idempotency_key
    - provider
    type: object
  billing.UpdateBillRequest:
    properties:
      discount:
        example: 5
        minimum: 0
        type: number
      due_date:
        example: "2026-12-31T23:59:59Z"
        type: string
      items:
        items:
          $ref: '#/definitions/billing.CreateBillItemRequest'
        type: array
      metadata:
        type: object
      notes:
        example: Payment received and verified
        type: string
      status:
        allOf:
        - $ref: '#/definitions/billing.BillStatus'
        example: PAID
      tax:
        example: 20
        minimum: 0
        type: number
    type: object
  payment.PaymentProvider:
    enum:
    - STRIPE
    - SSLCOMMERZ
    - PAYPAL
    - BKASH
    - DEFAULT
    type: string
    x-enum-varnames:
    - ProviderStripe
    - ProviderSSLCommerz
    - ProviderPayPal
    - ProviderBKash
    - ProviderDefault
  payment.PaymentResponse:
    properties:
      amount:
        example: 99.99
        type: number
      bill_id:
        example: bill_123abc456def
        type: string
      created_at:
        example: "2026-08-08T12:00:00Z"
        type: string
      currency:
        example: USD
        type: string
      customer_id:
        example: cust_987654
        type: string
      description:
        example: 'Payment for Invoice #1234'
        type: string
      id:
        example: pay_123abc456def
        type: string
      idempotency_key:
        example: ik_987654321
        type: string
      metadata:
        type: object
      payment_url:
        example: https://checkout.stripe.com/pay/cs_test_123
        type: string
      provider:
        allOf:
        - $ref: '#/definitions/payment.PaymentProvider'
        example: STRIPE
      status:
        allOf:
        - $ref: '#/definitions/payment.PaymentStatus'
        example: SUCCEEDED
      updated_at:
        example: "2026-08-08T12:00:00Z"
        type: string
    type: object
  payment.PaymentStatus:
    enum:
    - PENDING
    - PROCESSING
    - SUCCEEDED
    - FAILED
    - CANCELLED
    - REFUNDED
    - PARTIALLY_REFUNDED
    type: string
    x-enum-varnames:
    - PaymentStatusPending
    - PaymentStatusProcessing
    - PaymentStatusSucceeded
    - PaymentStatusFailed
    - PaymentStatusCancelled
    - PaymentStatusRefunded
    - PaymentStatusPartiallyRefunded
info:
  contact: {}
paths:
  /api/v1/bills:
    get:
      description: Retrieves paginated list of bills with optional status and customer
        filter
      parameters:
      - description: Filter by Customer ID
        in: query
        name: customer_id
        type: string
      - description: Filter by Bill status
        in: query
        name: status
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/billing.BillListResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List bills
      tags:
      - Billing
    post:
      consumes:
      - application/json
      description: Creates a new billing invoice with calculated totals and line items
      parameters:
      - description: Bill creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/billing.CreateBillRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/billing.BillResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new bill/invoice
      tags:
      - Billing
  /api/v1/bills/{id}:
    delete:
      description: Deletes a bill by ID
      parameters:
      - description: Bill ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a bill
      tags:
      - Billing
    get:
      description: Fetches full bill details including line items by bill ID
      parameters:
      - description: Bill ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/billing.BillResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a bill by ID
      tags:
      - Billing
    put:
      consumes:
      - application/json
      description: Updates existing bill metadata, status, or item list
      parameters:
      - description: Bill ID
        in: path
        name: id
        required: true
        type: string
      - description: Bill update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/billing.UpdateBillRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/billing.BillResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a bill
      tags:
      - Billing
  /api/v1/bills/{id}/pay:
    post:
      consumes:
      - application/json
      description: Initiates a payment towards a specific invoice and updates its
        paid balance and status
      parameters:
      - description: Bill ID
        in: path
        name: id
        required: true
        type: string
      - description: Bill payment payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/billing.PayBillRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/payment.PaymentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Pay a bill / invoice
      tags:
      - Billing
  /api/v1/bills/{id}/payments:
    get:
      description: Fetches full bill details along with all payment attempts and transactions
      parameters:
      - description: Bill ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/billing.BillPaymentDetailResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get payment history for a bill
      tags:
      - Billing
swagger: "2.0"
