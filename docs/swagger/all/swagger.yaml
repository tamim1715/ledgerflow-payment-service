basePath: /
definitions:
  internal_modules_billing.BillItem:
    properties:
      amount:
        type: number
      bill_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      quantity:
        type: integer
      unit_price:
        type: number
    type: object
  internal_modules_billing.BillListResponse:
    properties:
      bills:
        items:
          $ref: '#/definitions/internal_modules_billing.BillResponse'
        type: array
      limit:
        example: 10
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 1
        type: integer
    type: object
  internal_modules_billing.BillResponse:
    properties:
      bill_number:
        example: INV-2026-0001
        type: string
      created_at:
        example: "2026-08-07T15:00:00Z"
        type: string
      currency:
        example: USD
        type: string
      customer_id:
        example: cust_987654
        type: string
      discount:
        example: 10
        type: number
      due_date:
        example: "2026-12-31T23:59:59Z"
        type: string
      id:
        example: bill_123abc456def
        type: string
      issue_date:
        example: "2026-08-07T15:00:00Z"
        type: string
      items:
        items:
          $ref: '#/definitions/internal_modules_billing.BillItem'
        type: array
      metadata:
        type: object
      notes:
        example: Monthly enterprise subscription invoice
        type: string
      status:
        allOf:
        - $ref: '#/definitions/internal_modules_billing.BillStatus'
        example: DRAFT
      subtotal:
        example: 300
        type: number
      tax:
        example: 15
        type: number
      total_amount:
        example: 305
        type: number
      updated_at:
        example: "2026-08-07T15:00:00Z"
        type: string
    type: object
  internal_modules_billing.BillStatus:
    enum:
    - DRAFT
    - PENDING
    - PAID
    - OVERDUE
    - CANCELLED
    type: string
    x-enum-varnames:
    - BillStatusDraft
    - BillStatusPending
    - BillStatusPaid
    - BillStatusOverdue
    - BillStatusCancelled
  internal_modules_billing.CreateBillItemRequest:
    properties:
      description:
        example: Cloud Hosting & Infrastructure
        type: string
      quantity:
        example: 2
        type: integer
      unit_price:
        example: 150
        minimum: 0
        type: number
    required:
    - description
    - quantity
    - unit_price
    type: object
  internal_modules_billing.CreateBillRequest:
    properties:
      currency:
        example: USD
        type: string
      customer_id:
        example: cust_987654
        type: string
      discount:
        example: 10
        minimum: 0
        type: number
      due_date:
        example: "2026-12-31T23:59:59Z"
        type: string
      items:
        items:
          $ref: '#/definitions/internal_modules_billing.CreateBillItemRequest'
        type: array
      metadata:
        type: object
      notes:
        example: Monthly enterprise subscription invoice
        type: string
      tax:
        example: 15
        minimum: 0
        type: number
    required:
    - currency
    - customer_id
    - due_date
    - items
    type: object
  internal_modules_billing.UpdateBillRequest:
    properties:
      discount:
        example: 5
        minimum: 0
        type: number
      due_date:
        example: "2026-12-31T23:59:59Z"
        type: string
      items:
        items:
          $ref: '#/definitions/internal_modules_billing.CreateBillItemRequest'
        type: array
      metadata:
        type: object
      notes:
        example: Payment received and verified
        type: string
      status:
        allOf:
        - $ref: '#/definitions/internal_modules_billing.BillStatus'
        example: PAID
      tax:
        example: 20
        minimum: 0
        type: number
    type: object
  internal_modules_payment.CancelPaymentRequest:
    properties:
      reason:
        example: Customer requested cancellation
        type: string
    type: object
  internal_modules_payment.CreateCustomerRequest:
    properties:
      email:
        example: customer@example.com
        type: string
      name:
        example: Alex Morgan
        type: string
      phone:
        example: "+1234567890"
        type: string
      stripe_customer_id:
        example: cus_123abc
        type: string
    required:
    - email
    type: object
  internal_modules_payment.CreatePaymentRequest:
    properties:
      amount:
        example: 99.99
        type: number
      currency:
        example: USD
        type: string
      customer_id:
        example: cust_987654
        type: string
      description:
        example: 'Payment for Invoice #1234'
        type: string
      idempotency_key:
        example: ik_987654321
        type: string
      metadata:
        type: object
      provider:
        allOf:
        - $ref: '#/definitions/internal_modules_payment.PaymentProvider'
        example: STRIPE
    required:
    - amount
    - currency
    - customer_id
    - idempotency_key
    - provider
    type: object
  internal_modules_payment.CreateRefundRequest:
    properties:
      amount:
        example: 25
        type: number
      payment_id:
        example: pay_123abc456def
        type: string
      reason:
        example: Customer requested cancellation
        type: string
    required:
    - amount
    - payment_id
    type: object
  internal_modules_payment.CustomerListResponse:
    properties:
      customers:
        items:
          $ref: '#/definitions/internal_modules_payment.CustomerResponse'
        type: array
      limit:
        example: 10
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 2
        type: integer
    type: object
  internal_modules_payment.CustomerResponse:
    properties:
      created_at:
        example: "2026-08-08T12:00:00Z"
        type: string
      email:
        example: customer@example.com
        type: string
      id:
        example: cust_987654
        type: string
      name:
        example: Alex Morgan
        type: string
      phone:
        example: "+1234567890"
        type: string
      stripe_customer_id:
        example: cus_123abc
        type: string
      updated_at:
        example: "2026-08-08T12:00:00Z"
        type: string
    type: object
  internal_modules_payment.PaymentDetailResponse:
    properties:
      amount:
        example: 99.99
        type: number
      created_at:
        example: "2026-08-08T12:00:00Z"
        type: string
      currency:
        example: USD
        type: string
      customer_id:
        example: cust_987654
        type: string
      description:
        example: 'Payment for Invoice #1234'
        type: string
      id:
        example: pay_123abc456def
        type: string
      idempotency_key:
        example: ik_987654321
        type: string
      metadata:
        type: object
      payment_url:
        example: https://checkout.stripe.com/pay/cs_test_123
        type: string
      provider:
        allOf:
        - $ref: '#/definitions/internal_modules_payment.PaymentProvider'
        example: STRIPE
      refunds:
        items:
          $ref: '#/definitions/internal_modules_payment.RefundResponse'
        type: array
      status:
        allOf:
        - $ref: '#/definitions/internal_modules_payment.PaymentStatus'
        example: SUCCEEDED
      transactions:
        items:
          $ref: '#/definitions/internal_modules_payment.TransactionResponse'
        type: array
      updated_at:
        example: "2026-08-08T12:00:00Z"
        type: string
    type: object
  internal_modules_payment.PaymentListResponse:
    properties:
      limit:
        example: 10
        type: integer
      page:
        example: 1
        type: integer
      payments:
        items:
          $ref: '#/definitions/internal_modules_payment.PaymentResponse'
        type: array
      total:
        example: 10
        type: integer
    type: object
  internal_modules_payment.PaymentProvider:
    enum:
    - STRIPE
    - SSLCOMMERZ
    - PAYPAL
    - BKASH
    type: string
    x-enum-varnames:
    - ProviderStripe
    - ProviderSSLCommerz
    - ProviderPayPal
    - ProviderBKash
  internal_modules_payment.PaymentResponse:
    properties:
      amount:
        example: 99.99
        type: number
      created_at:
        example: "2026-08-08T12:00:00Z"
        type: string
      currency:
        example: USD
        type: string
      customer_id:
        example: cust_987654
        type: string
      description:
        example: 'Payment for Invoice #1234'
        type: string
      id:
        example: pay_123abc456def
        type: string
      idempotency_key:
        example: ik_987654321
        type: string
      metadata:
        type: object
      payment_url:
        example: https://checkout.stripe.com/pay/cs_test_123
        type: string
      provider:
        allOf:
        - $ref: '#/definitions/internal_modules_payment.PaymentProvider'
        example: STRIPE
      status:
        allOf:
        - $ref: '#/definitions/internal_modules_payment.PaymentStatus'
        example: SUCCEEDED
      updated_at:
        example: "2026-08-08T12:00:00Z"
        type: string
    type: object
  internal_modules_payment.PaymentStatus:
    enum:
    - PENDING
    - PROCESSING
    - SUCCEEDED
    - FAILED
    - CANCELLED
    - REFUNDED
    - PARTIALLY_REFUNDED
    type: string
    x-enum-varnames:
    - PaymentStatusPending
    - PaymentStatusProcessing
    - PaymentStatusSucceeded
    - PaymentStatusFailed
    - PaymentStatusCancelled
    - PaymentStatusRefunded
    - PaymentStatusPartiallyRefunded
  internal_modules_payment.RefundListResponse:
    properties:
      limit:
        example: 10
        type: integer
      page:
        example: 1
        type: integer
      refunds:
        items:
          $ref: '#/definitions/internal_modules_payment.RefundResponse'
        type: array
      total:
        example: 1
        type: integer
    type: object
  internal_modules_payment.RefundResponse:
    properties:
      amount:
        example: 25
        type: number
      created_at:
        example: "2026-08-08T12:00:00Z"
        type: string
      currency:
        example: USD
        type: string
      id:
        example: ref_123abc456def
        type: string
      payment_id:
        example: pay_123abc456def
        type: string
      provider_refund_id:
        example: re_stripe_123
        type: string
      reason:
        example: Customer requested cancellation
        type: string
      status:
        allOf:
        - $ref: '#/definitions/internal_modules_payment.RefundStatus'
        example: SUCCEEDED
      updated_at:
        example: "2026-08-08T12:00:00Z"
        type: string
    type: object
  internal_modules_payment.RefundStatus:
    enum:
    - PENDING
    - SUCCEEDED
    - FAILED
    type: string
    x-enum-varnames:
    - RefundStatusPending
    - RefundStatusSucceeded
    - RefundStatusFailed
  internal_modules_payment.TransactionResponse:
    properties:
      amount:
        example: 99.99
        type: number
      created_at:
        example: "2026-08-08T12:00:00Z"
        type: string
      currency:
        example: USD
        type: string
      error_code:
        type: string
      error_message:
        type: string
      id:
        example: tx_123abc456def
        type: string
      payment_id:
        example: pay_123abc456def
        type: string
      provider_transaction_id:
        example: ch_stripe_123
        type: string
      raw_response:
        type: object
      status:
        allOf:
        - $ref: '#/definitions/internal_modules_payment.TransactionStatus'
        example: SUCCESS
      type:
        allOf:
        - $ref: '#/definitions/internal_modules_payment.TransactionType'
        example: CHARGE
    type: object
  internal_modules_payment.TransactionStatus:
    enum:
    - SUCCESS
    - FAILED
    - PENDING
    type: string
    x-enum-varnames:
    - TxStatusSuccess
    - TxStatusFailed
    - TxStatusPending
  internal_modules_payment.TransactionType:
    enum:
    - CHARGE
    - REFUND
    - REVERSAL
    type: string
    x-enum-varnames:
    - TxTypeCharge
    - TxTypeRefund
    - TxTypeReversal
host: localhost:8081
info:
  contact:
    email: support@ledgerflow.io
    name: LedgerFlow Engineering Team
    url: https://ledgerflow.io/support
  description: Enterprise Multi-Tenant Payment Gateway & Automated Billing Microservice
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: LedgerFlow Payment & Billing Service API
  version: "1.0"
paths:
  /api/v1/bills:
    get:
      description: Retrieves paginated list of bills with optional status and customer
        filter
      parameters:
      - description: Filter by Customer ID
        in: query
        name: customer_id
        type: string
      - description: Filter by Bill status
        in: query
        name: status
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_billing.BillListResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List bills
      tags:
      - Billing
    post:
      consumes:
      - application/json
      description: Creates a new billing invoice with calculated totals and line items
      parameters:
      - description: Bill creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_billing.CreateBillRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_billing.BillResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new bill/invoice
      tags:
      - Billing
  /api/v1/bills/{id}:
    delete:
      description: Deletes a bill by ID
      parameters:
      - description: Bill ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a bill
      tags:
      - Billing
    get:
      description: Fetches full bill details including line items by bill ID
      parameters:
      - description: Bill ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_billing.BillResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a bill by ID
      tags:
      - Billing
    put:
      consumes:
      - application/json
      description: Updates existing bill metadata, status, or item list
      parameters:
      - description: Bill ID
        in: path
        name: id
        required: true
        type: string
      - description: Bill update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_billing.UpdateBillRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_billing.BillResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a bill
      tags:
      - Billing
  /api/v1/payments:
    get:
      description: Retrieves paginated list of payments with optional customer, status,
        and provider filters
      parameters:
      - description: Filter by Customer ID
        in: query
        name: customer_id
        type: string
      - description: Filter by Payment status
        in: query
        name: status
        type: string
      - description: Filter by Provider (STRIPE, SSLCOMMERZ, PAYPAL, BKASH)
        in: query
        name: provider
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_payment.PaymentListResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List payments
      tags:
      - Payments
    post:
      consumes:
      - application/json
      description: Creates a new payment, executes idempotency check, initiates gateway
        transaction, and records ledger entries
      parameters:
      - description: Payment initiation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_payment.CreatePaymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_payment.PaymentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Customer not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create and initiate a payment
      tags:
      - Payments
  /api/v1/payments/{id}:
    get:
      description: Fetches comprehensive payment information including transactions
        and refunds
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_payment.PaymentDetailResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get payment details
      tags:
      - Payments
  /api/v1/payments/{id}/cancel:
    post:
      consumes:
      - application/json
      description: Cancels a pending or processing payment and records reversal transaction
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      - description: Cancellation reason
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_modules_payment.CancelPaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_payment.PaymentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cancel a payment
      tags:
      - Payments
  /api/v1/payments/{id}/capture:
    post:
      description: Captures an authorized or processing payment and transitions status
        to SUCCEEDED
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_payment.PaymentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Capture or confirm a payment
      tags:
      - Payments
  /api/v1/payments/{id}/refunds:
    get:
      description: Fetches all refunds executed against a payment ID
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_payment.RefundListResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List refunds for a specific payment
      tags:
      - Refunds
  /api/v1/payments/{id}/transactions:
    get:
      description: Fetches audit ledger transaction history for a specific payment
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_modules_payment.TransactionResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List transactions for a payment
      tags:
      - Payments
  /api/v1/payments/customers:
    get:
      description: Retrieves paginated list of registered customers
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_payment.CustomerListResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List customers
      tags:
      - Customers
    post:
      consumes:
      - application/json
      description: Registers a new customer profile for payment processing
      parameters:
      - description: Customer creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_payment.CreateCustomerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_payment.CustomerResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Customer with email already exists
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a customer
      tags:
      - Customers
  /api/v1/payments/customers/{id}:
    get:
      description: Fetches customer profile by customer ID
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_payment.CustomerResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get customer by ID
      tags:
      - Customers
  /api/v1/payments/refunds:
    post:
      consumes:
      - application/json
